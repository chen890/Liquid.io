[project]
name = "equitylens-server"
version = "0.1.0"
description = "EquityLens extraction server — Meezeh auth + Sofia API proxy"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "httpx>=0.25",
    "python-dotenv>=1.0",
    "me-auth-client>=0.39.0",
    "openai>=1.75",
    "requests-oauthlib>=2.0.0",
]

[tool.uv]
extra-index-url = [
    "https://artifactory.sddc.mobileye.com/artifactory/api/pypi/pypi/simple"
]
